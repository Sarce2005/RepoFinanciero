name: Sesión diaria del torneo

on:
  schedule:
    # 21:30 UTC de lunes a viernes = 22:30 en Madrid (horario de invierno),
    # ~30-90 min después del cierre de Wall Street. GitHub puede retrasarlo unos minutos.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: torneo
  cancel-in-progress: false

jobs:
  sesion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Jugar la sesión
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m torneo.main run

      - name: Guardar estado e informe en el repositorio
        run: |
          git config user.name "torneo-bot"
          git config user.email "torneo-bot@users.noreply.github.com"
          git add state docs
          git diff --cached --quiet || git commit -m "Sesión $(date -u +%F)"
          git push

